stages:
  - test
  - validate

semgrep-sast:
  stage: test
  image: python:3.11
  script:
    - python devsecops_demo/security_check.py || true
    - echo "Relatório SAST gerado."
  artifacts:
    when: always
    paths:
      - devsecops_demo/app.py

check-sast-report:
  stage: validate
  image: python:3.11
  script:
    - python devsecops_demo/security_check.py
