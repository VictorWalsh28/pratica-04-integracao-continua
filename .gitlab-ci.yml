image:
  name: hashicorp/terraform:1.9.8
  entrypoint: [""]

stages:
  - validate
  - plan
  - apply

before_script:
  - cd terraform
  - terraform init -input=false

fmt:
  stage: validate
  script:
    - terraform fmt -check

validate:
  stage: validate
  script:
    - terraform validate

plan:
  stage: plan
  script:
    - terraform plan -out=plan.out
  artifacts:
    paths:
      - terraform/plan.out
    expire_in: 1 day

apply:
  stage: apply
  dependencies:
    - plan
  script:
    - terraform apply -auto-approve plan.out
    - cat exemplo.txt
  artifacts:
    paths:
      - terraform/exemplo.txt
    expire_in: 1 day
  when: manual
