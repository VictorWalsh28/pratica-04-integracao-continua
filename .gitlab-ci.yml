stages:
  - test

test-job1:
  stage: test
  image: python:3.11
  script:
    - echo "Primeiro job de teste executado com sucesso"

test-job2:
  stage: test
  image: python:3.11
  before_script:
    - pip install -r requirements.txt
  script:
    - python -m coverage run -m unittest -v tests/appTest.py
    - python -m coverage report --fail-under=100
  coverage: '/TOTAL.*\s+(\d+%)/'
