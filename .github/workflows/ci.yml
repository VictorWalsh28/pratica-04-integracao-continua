name: CI - Testes e Cobertura

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-job1:
    runs-on: ubuntu-latest
    steps:
      - name: Mensagem do primeiro job
        run: echo "Primeiro job de teste executado com sucesso"

  test-job2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Executar testes unitarios com cobertura
        run: |
          python -m coverage run -m unittest -v tests/appTest.py
          python -m coverage report --fail-under=100
