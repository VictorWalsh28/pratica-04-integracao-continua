name: Pratica 08 - Terraform IaC

on:
  push:
    branches: [ main ]
    paths:
      - "terraform/**"
      - ".github/workflows/iac-terraform.yml"
      - ".gitlab-ci.yml"
  workflow_dispatch:
    inputs:
      aprovar_apply:
        description: "Aprovar terraform apply?"
        required: true
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

  plan:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -out=plan.out

      - name: Salvar plano
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/plan.out

  apply:
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.aprovar_apply == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Baixar plano
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve plan.out

      - name: Conferir arquivo criado
        run: |
          echo "Conteudo do arquivo:"
          cat exemplo.txt

      - name: Salvar arquivo gerado
        uses: actions/upload-artifact@v4
        with:
          name: arquivo-criado-terraform
          path: terraform/exemplo.txt
